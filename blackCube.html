<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rusty Lake Untold: The Lake</title>
    <link rel="icon" type="image/png" href="img/assets/icon.png">

    <style>
        :root {
            --paper: #e8e3d8;
            --accent: #c7ba91;
            --line: #6d6656;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--paper);
            background: radial-gradient(ellipse at 50% 5%, #424036 0, #22221e 48%, #111210 100%);
            font: 16px/1.45 Georgia, "Times New Roman", serif;
        }

        button, input {
            font: inherit;
        }

        button {
            color: var(--paper);
            border: 1px solid var(--line);
            background: #2b2922;
            cursor: pointer;
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }


        .start-screen {
            position: fixed;
            z-index: 100;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            overflow: auto;
            background: radial-gradient(ellipse at 50% 40%, #414036 0, #1b1b18 55%, #090a09 100%);
        }

        .start-screen[hidden] {
            display: none;
        }

        .start-content {
            width: min(700px, 100%);
            text-align: center;
            animation: startAppear .9s ease both;
        }

        .start-mark {
            width: clamp(110px, 22vw, 190px);
            height: auto;
            margin-bottom: 24px;
            opacity: .9;
            filter: drop-shadow(0 12px 24px #0009);
            cursor: pointer;
            user-select: none;
        }

        .start-title {
            margin: 0;
            color: #e7e0cc;
            font-size: clamp(30px, 7vw, 66px);
            font-weight: normal;
            letter-spacing: .08em;
            line-height: 1.12;
            text-shadow: 0 4px 20px #000;
        }

        .start-subtitle {
            margin: 14px 0 34px;
            color: #b5aa8c;
            font-size: clamp(13px, 2.6vw, 18px);
            letter-spacing: .25em;
            text-transform: uppercase;
        }

        .start-actions {
            display: grid;
            justify-items: center;
            gap: 12px;
        }

        .start-button {
            min-width: 220px;
            padding: 12px 28px;
            border-color: #b8aa80;
            background: #39362b;
            color: #f1ead7;
            font-size: 18px;
            letter-spacing: .12em;
            text-transform: uppercase;
            transition: background .2s, transform .2s;
        }

        .start-button:hover:not(:disabled) {
            transform: translateY(-2px);
            background: #514a38;
        }

        .start-button.settings {
            min-width: 180px;
            padding: 9px 22px;
            font-size: 14px;
        }

        .start-version {
            margin-top: 38px;
            color: #777366;
            font-size: 12px;
            letter-spacing: .12em;
        }

        @keyframes startAppear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .rotate-screen {
            position: fixed;
            z-index: 1000;
            inset: 0;
            display: none;
            place-items: center;
            padding: 24px;
            color: #f4efdf;
            background: radial-gradient(ellipse at 50% 40%, #35342e 0, #151613 62%, #080908 100%);
            text-align: center;
        }

        .rotate-screen.visible {
            display: grid;
        }

        .rotate-content {
            width: min(420px, 100%);
            animation: startAppear .5s ease both;
        }

        .rotate-illustration {
            display: block;
            width: min(230px, 62vw);
            height: auto;
            margin: 0 auto 26px;
            filter: drop-shadow(0 12px 22px #0009);
        }

        .rotate-title {
            margin: 0;
            color: #e9e2cf;
            font-size: clamp(23px, 6vw, 34px);
            font-weight: normal;
            letter-spacing: .04em;
        }

        .rotate-caption {
            margin: 12px 0 0;
            color: #b5aa8c;
            font-size: 15px;
        }

        .game {
            width: min(1450px, 100%);
            margin: 0 auto;
            padding: 16px;
        }

        .game[hidden] {
            display: none;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            color: var(--accent);
            font-size: clamp(21px, 3vw, 32px);
            font-weight: normal;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .top-actions, .room-actions, .modal-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .top-actions button, .room-actions button, .modal-actions button {
            padding: 8px 11px;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 290px;
            gap: 12px;
            align-items: start;
        }

        .scene-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 2384 / 1380;
            overflow: hidden;
            border: 1px solid #77715f;
            background: #10100e;
            box-shadow: 0 12px 40px #0009;
        }

        .scene-wrap > img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #hotspots {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        .hotspot {
            position: absolute;
            display: block;
            padding: 0;
            border: 1px solid transparent;
            background: transparent;
            pointer-events: auto;
        }

        .hotspot:hover, .hotspot:focus-visible {
            border-color: #e5d6a3bb;
            background: #e5d6a318;
            outline: none;
        }

        #gameMessage {
            position: absolute;
            z-index: 5;
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
            width: min(92%, 760px);
            padding: 9px 14px;
            color: #fff;
            background: #000;
            border: 1px solid #777;
            text-align: center;
            line-height: 1.4;
            white-space: pre-line;
            pointer-events: none;
            opacity: 1;
        }

        #gameMessage:empty {
            display: none;
        }

        #gameMessage.fade-out {
            animation: messageFade .6s ease forwards;
        }

        @keyframes messageFade {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        .darkness {
            position: absolute;
            z-index: 2;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(
                    ellipse at 50% 48%,
                    transparent 0,
                    #09090745 45%,
                    #050504bb 100%
            );
            transition: opacity 1s ease;
        }

        .darkness.on {
            opacity: .200;
            animation: uneasy-flicker 3s infinite;
        }

        .darkness.flicker {
            animation: light-flicker .9s ease-in-out 1;
        }

        @keyframes uneasy-flicker {
            0%, 91%, 100% {
                opacity: .100;
            }
            92% {
                opacity: .500;
            }
            94% {
                opacity: .500;
            }
            96% {
                opacity: .500;
            }
            98% {
                opacity: .150;
            }
        }

        @keyframes light-flicker {
            0%, 100% {
                opacity: .66;
            }
            20% {
                opacity: .2;
            }
            35% {
                opacity: .78;
            }
            53% {
                opacity: .32;
            }
            70% {
                opacity: .72;
            }
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel {
            padding: 12px 14px;
            border: 1px solid var(--line);
            background: #1c1b17e8;
        }

        .panel h2 {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 14px;
            font-weight: normal;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        #inventory {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .item {
            width: 100%;
            padding: 7px 9px;
            text-align: left;
            font-size: 14px;
            border: 1px solid #766c52;
            background: #302d24;
        }

        .item.selected {
            outline: 2px solid var(--accent);
            background: #514a38;
        }

        .room-actions {
            justify-content: flex-start;
            margin-top: 10px;
        }

        .modal {
            position: fixed;
            z-index: 10;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 18px;
            background: #000b;
        }

        .modal[hidden] {
            display: none;
        }

        .modal-card {
            width: min(560px, 100%);
            max-height: 90vh;
            overflow: auto;
            padding: 20px;
            border: 1px solid var(--accent);
            background: #211f1a;
            box-shadow: 0 18px 60px #000c;
        }

        .modal-card h2 {
            margin: 0 0 10px;
            color: var(--accent);
            font-weight: normal;
        }

        .modal-card p {
            white-space: pre-line;
        }

        .modal-card img {
            display: block;
            width: 100%;
            max-height: 60vh;
            margin: 12px 0;
            object-fit: contain;
            background: #111;
        }

        .modal-card input {
            width: 100%;
            padding: 10px;
            color: var(--paper);
            border: 1px solid #82785e;
            background: #12120f;
            letter-spacing: .08em;
        }

        .gm-label {
            color: #a79d82;
            font-size: 12px;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        .gm-text {
            color: #e6dfcd;
            font-size: clamp(18px, 2.4vw, 23px);
            font-style: italic;
            line-height: 1.6;
        }


        #timer {
            position: fixed;
            z-index: 20;
            top: 12px;
            right: 12px;
            padding: 6px 12px;
            color: var(--accent);
            background: #1c1b17e8;
            border: 1px solid var(--line);
            font: 14px/1.2 monospace;
            letter-spacing: .08em;
            pointer-events: none;
        }

        #timer[hidden] {
            display: none;
        }


        .leaderboard {
            width: 100%;
            max-height: 46vh;
            overflow-y: auto;
            margin: 10px 0;
            border: 1px solid #6d6656;
        }

        .leaderboard table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .leaderboard th, .leaderboard td {
            padding: 6px 10px;
            text-align: left;
            border-bottom: 1px solid #3a372e;
        }

        .leaderboard th {
            position: sticky;
            top: 0;
            background: #2b2922;
            color: var(--accent);
            font-weight: normal;
            letter-spacing: .08em;
            text-transform: uppercase;
            font-size: 12px;
        }

        .leaderboard tr:nth-child(2) td {
            color: #e7d27a;
        }

        .leaderboard tr:nth-child(3) td {
            color: #cfcfcf;
        }

        .leaderboard tr:nth-child(4) td {
            color: #c79a6b;
        }

        .leaderboard .empty {
            padding: 12px;
            text-align: center;
            color: #8a8272;
            font-style: italic;
        }

        .leaderboard-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 10px;
        }

        @media (max-width: 850px) {
            .layout {
                grid-template-columns: minmax(0, 1fr) 230px;
            }
        }

        @media (max-width: 650px) {
            .game {
                padding: 9px;
            }

            header {
                align-items: flex-start;
                flex-direction: column;
            }

            .layout {
                grid-template-columns: 1fr;
            }

            .scene-wrap {
                min-height: 230px;
            }
        }
    </style>
</head>

<body>
<!-- НОВОЕ: таймер -->
<div id="timer" hidden>00:00:00</div>

<section class="start-screen" id="startScreen">
    <div class="start-content">
        <img class="start-mark" id="startMark" src="img/assets/icon.png" alt="">

        <h1 class="start-title">Rusty Lake<br>Untold: The Lake</h1>
        <p class="start-subtitle">Воспоминания ждут</p>

        <div class="start-actions">
            <button class="start-button" id="playBtn">Играть</button>
        </div>
    </div>
</section>

<section class="rotate-screen" id="rotateScreen" aria-live="assertive">
    <div class="rotate-content">
        <svg class="rotate-illustration" viewBox="0 0 260 220" role="img" aria-label="Иллюстрация поворота устройства">
            <defs>
                <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
                    <feOffset dy="5"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope=".35"/>
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            <path d="M58 66 A84 84 0 0 1 191 45" fill="none" stroke="#b8aa80" stroke-width="5" stroke-linecap="round"/>
            <path d="M186 30 L204 43 L182 51" fill="none" stroke="#b8aa80" stroke-width="5" stroke-linecap="round"
                  stroke-linejoin="round"/>
            <path d="M202 154 A84 84 0 0 1 69 175" fill="none" stroke="#b8aa80" stroke-width="5"
                  stroke-linecap="round"/>
            <path d="M74 190 L56 177 L78 169" fill="none" stroke="#b8aa80" stroke-width="5" stroke-linecap="round"
                  stroke-linejoin="round"/>
            <g filter="url(#shadow)" transform="translate(130 110) rotate(90) translate(-130 -110)">
                <rect x="82" y="33" width="96" height="154" rx="12" fill="#171815" stroke="#c7ba91" stroke-width="4"/>
                <rect x="91" y="47" width="78" height="124" rx="4" fill="#292a24" stroke="#6d6656" stroke-width="2"/>
                <circle cx="130" cy="179" r="3" fill="#c7ba91"/>
                <path d="M108 102 C117 89 143 89 152 102 C143 115 117 115 108 102Z" fill="#b8aa80" opacity=".9"/>
                <circle cx="130" cy="102" r="6" fill="#171815"/>
            </g>
        </svg>
        <h2 class="rotate-title">Поверните устройство горизонтально</h2>
        <p class="rotate-caption">Так будет удобнее исследовать комнаты.</p>
    </div>
</section>

<main class="game" id="game" hidden>
    <header>
        <div class="top-actions">
            <button id="resetBtn">Сбросить игру</button>
        </div>
    </header>

    <div class="layout">
        <section>
            <div class="scene-wrap">
                <img id="sceneImage" src="img/assets/1.png" alt="">
                <div class="darkness" id="darkness"></div>
                <div id="hotspots"></div>
                <div id="gameMessage" aria-live="polite"></div>
            </div>
            <nav class="room-actions" id="roomActions"></nav>
        </section>

        <aside class="sidebar">
            <section class="panel">
                <h2>Инвентарь</h2>
                <div id="inventory">Пока пусто.</div>
            </section>
        </aside>
    </div>
</main>

<div class="modal" id="modal" hidden>
    <section class="modal-card" id="modalCard" role="dialog" aria-modal="true">
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>
        <div class="modal-actions" id="modalActions"></div>
    </section>
</div>

            "о стол, стоящий над тобой. Когда ты вылезаешь из-под стола, ты замечаешь огромное устройство в стене,\n" +
            "нависающее над тобой. Небольшой экран светится ярко-красным, и на нем мигает сообщение."
    };

    function freshState() {
        return JSON.parse(JSON.stringify(INITIAL_STATE));
    }

    function loadState() {
        try {
            const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
            if (!saved || !saved.flags || !saved.items) return freshState();

            const base = freshState();
            return {
                ...base,
                ...saved,
                flags: {
                    ...base.flags,
                    ...saved.flags,
                    visited: {...base.flags.visited, ...(saved.flags.visited || {})}
                }
            };
        } catch {
            return freshState();
        }
    }

    let state = loadState();

    function save() {
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }

    function has(item) {
        return state.items.includes(item);
    }

    function give(item) {
        if (!has(item)) state.items.push(item);
        state.selected = item;
        renderInventory();
        save();
    }

    function remove(item) {
        state.items = state.items.filter(x => x !== item);
        if (state.selected === item) state.selected = null;
        renderInventory();
        save();
    }


    function say(text) {
        const box = document.getElementById("gameMessage");
        clearTimeout(messageTimer);
        clearTimeout(fadeTimer);

        box.classList.remove("fade-out");
        box.textContent = text || "";

        if (!text) return;

        messageTimer = setTimeout(() => {
            box.classList.add("fade-out");
            fadeTimer = setTimeout(() => {
                if (box.classList.contains("fade-out")) {
                    box.textContent = "";
                    box.classList.remove("fade-out");
                }
            }, 600);
        }, 3000);
    }

    function closeModal() {
        document.getElementById("modal").hidden = true;
        document.getElementById("modalCard").classList.remove("gm-card");
    }

    function buildModal(title, text, buttons = []) {
        document.getElementById("modalTitle").textContent = title;
        const body = document.getElementById("modalBody");
        body.innerHTML = "";

        const p = document.createElement("p");
        p.textContent = text;
        body.appendChild(p);

        const actions = document.getElementById("modalActions");
        actions.innerHTML = "";

        buttons.forEach(({label, action}) => {
            const button = document.createElement("button");
            button.textContent = label;
            button.onclick = action;
            actions.appendChild(button);
        });

        const close = document.createElement("button");
        close.textContent = "Закрыть";
        close.onclick = closeModal;
        actions.appendChild(close);

        document.getElementById("modal").hidden = false;
    }

    function modal(title, text, buttons = []) {
        document.getElementById("modalCard").classList.remove("gm-card");
        buildModal(title, text, buttons);
    }

    function gm(text, onContinue) {
        const card = document.getElementById("modalCard");
        card.classList.add("gm-card");

        document.getElementById("modalTitle").textContent = "";
        const body = document.getElementById("modalBody");
        body.innerHTML = "";

        const label = document.createElement("div");
        label.className = "gm-label";
        label.textContent = "Ведущий";

        const p = document.createElement("p");
        p.className = "gm-text";
        p.textContent = text;
        body.append(label, p);

        const actions = document.getElementById("modalActions");
        actions.innerHTML = "";

        const next = document.createElement("button");
        next.textContent = "Продолжить";
        next.onclick = () => {
            closeModal();
            if (onContinue) onContinue();
        };
        actions.appendChild(next);

        document.getElementById("modal").hidden = false;
    }

    function inputModal(title, text, placeholder, callback) {
        document.getElementById("modalCard").classList.remove("gm-card");
        document.getElementById("modalTitle").textContent = title;

        const body = document.getElementById("modalBody");
        body.innerHTML = "";

        const p = document.createElement("p");
        p.textContent = text;

        const input = document.createElement("input");
        input.placeholder = placeholder || "";
        input.autocomplete = "off";
        body.append(p, input);

        const actions = document.getElementById("modalActions");
        actions.innerHTML = "";

        const submit = document.createElement("button");
        submit.textContent = "Ввести";
        submit.onclick = () => {
            const value = input.value.trim();
            closeModal();
            callback(value);
            save();
        };

        const cancel = document.createElement("button");
        cancel.textContent = "Отмена";
        cancel.onclick = closeModal;

        actions.append(submit, cancel);
        document.getElementById("modal").hidden = false;
        input.focus();

        input.addEventListener("keydown", event => {
            if (event.key === "Enter") submit.click();
        });
    }

    function cardModal(file, title, text) {
        document.getElementById("modalCard").classList.remove("gm-card");
        document.getElementById("modalTitle").textContent = title;

        const body = document.getElementById("modalBody");
        body.innerHTML = "";

        const p = document.createElement("p");
        p.textContent = text;

        const img = document.createElement("img");
        img.src = asset(file);
        img.alt = title;
        img.onerror = () => {
            img.hidden = true;
        };

        body.append(p, img);

        const actions = document.getElementById("modalActions");
        actions.innerHTML = "";
        const close = document.createElement("button");
        close.textContent = "Закрыть";
        close.onclick = closeModal;
        actions.appendChild(close);

        document.getElementById("modal").hidden = false;
    }

    function renderInventory() {
        const box = document.getElementById("inventory");
        if (state.room === "black") {
            box.innerHTML = "";
            return;
        }
        box.innerHTML = "";

        if (!state.items.length) {
            box.textContent = "Пока пусто.";
            return;
        }

        state.items.forEach(item => {
            const button = document.createElement("button");
            button.className = "item" + (state.selected === item ? " selected" : "");
            button.textContent = item;

            button.onclick = () => {
                if (state.selected === item) {
                    inspectItem(item);
                } else {
                    state.selected = item;
                    renderInventory();
                    say(`${item}`);
                    save();
                }
            };

            box.appendChild(button);
        });
    }

    function renderRoomActions() {
        const nav = document.getElementById("roomActions");
        nav.innerHTML = "";

        if (state.room === "black") return;

        const addButton = (label, callback) => {
            const button = document.createElement("button");
            button.textContent = label;
            button.onclick = callback;
            nav.appendChild(button);
        };

        const notOnMap = state.room !== "bedroom" &&
            state.room !== "corridor" &&
            state.room !== "corridorSecret" &&
            state.room !== "maze";

        if (notOnMap && state.flags.bedroomDoor) {
            const target = state.flags.secretDoorOpen ? "corridorSecret" : "corridor";
            addButton("Карта коридора", () => go(target));
        }

        if (state.room === "maze") {
            addButton("Назад в спальню", () => go("bedroom"));
        }
    }

    function go(room) {
        state.room = room;
        say("");
        render();

        if (!state.flags.visited[room]) {
            state.flags.visited[room] = true;
            save();
            if (roomNarration[room]) {
                gm(roomNarration[room]);
            }
        }
    }

    function enterRoom(room) {
        if (room === "power") {
            if ((state.selected === "ID-карта" && has("ID-карта")) || (state.selected === "Бумажные скрепки" && has("Бумажные скрепки")) || state.flags.powerDoor) {
                state.flags.powerDoor = true;
                if (state.flags.key) {
                    go("power1");
                } else if (state.flags.keyt) {
                    go("power2");
                } else {
                    go("power");
                }
            } else {
                say("Дверь электрощитовой заперта.");
            }
            return;
        }

        if (room === "office" || room === "office1") {
            if (!state.flags.powerOn) {
                say("Считыватель у двери не работает.");
                return;
            }

            if (!state.flags.officeOpen) {
                if (state.selected === "Рука" && has("Рука")) {
                    remove("Рука");
                    state.flags.officeOpen = true;
                    say("Считыватель принимает отпечаток. Дверь открывается.");
                } else {
                    say("Считыватель не принимает отпечаток.");
                    return;
                }
            }
            if (state.flags.papka) {
                go("office1");
            } else {
                go("office");
            }
        }
    }

                    gm("Сразу как только ты нажимаешь на кнопку,\n" +
                        "ты слышишь, как за стеной оживает тяжелый\n" +
                        "механизм. Рядом с кнопкой открывается\n" +
                        "большой квадратный проем, и на другой\n" +
                        "стороны двери вы узнаете надпись: «Пора\n" +
                        "просыпаться». За дверью ты видишь знакомый\n" +
                        "коридор.", null);
                } else say("Механизм уже сработал.");
                break;

            case "machine":
                handleMachine();
                break;

            case "eyes":
                askFinalWord();
                break;
        }

        save();
        renderInventory();
        updateDarkness();
    }

    function computerInteraction() {
        if (!state.flags.powerOn) {
            say("Компьютер не включается.");
            return;
        }
        say("На экране появляется окно авторизации.");
        if (!state.flags.computerLoggedIn) {
            inputModal("Компьютер", "Окно авторизации.", "Пароль", code => {
                if (code === "3141") {
                    state.flags.computerLoggedIn = true;
                    remove("ID-карта")
                    say("На экране открывается рабочий стол.");
                } else say("Пароль не принят.");
            });
            return;
        }

        if (state.selected === "Дискета" && has("Дискета")) {
            remove("Дискета");
            state.flags.disketteUsed = true;
            say("Компьютер читает дискету.");
            gm("Появляется черная консоль с надписью:\n" +
                "«Программа для извлечения воспоминаний».\n" +
                "Полоса загрузки медленно заполняется.\n" +
                "Пока программа загружается, на экране\n" +
                "открывается и запускается видео", () => gm("Ты видишь самого себя: ты стоишь в машине,\n" +
                "смотришь прямо в камеру и повторяешь\n" +
                "слова: разум, душа, память, узрите, замóк.\n" +
                "Пока видео повторяется несколько раз, полоса\n" +
                "загрузки заполняется до 100%, и все экраны\n" +
                "закрываются."), null);
            return;
        }

        modal("Компьютер", "На рабочем столе несколько значков.", [
            {
                label: "Текстовый файл", action: () => {
                    closeModal();
                    cardModal("11", "Текстовый файл", "Ты открываешь найденный файл.");
                }
            },
            {
                label: "Видеопоток камер", action: () => {
                    closeModal();
                    if (state.flags.disketteUsed && state.flags.cameraDisabled) {
                        gm("На экране с шумами ты видишь полностью\n" +
                            "черный силуэт, стоящий на кухне с телефоном\n" +
                            "у уха. Он стоит еще секунду, затем бросает\n" +
                            "трубку и покидает комнату.", null);
                        state.flags.blackPhone = true;
                        state.flags.cameraDisabled = false;
                    } else if (!state.flags.cameraDisabled && !state.flags.camera) {
                        state.flags.cameraDisabled = true;
                        state.flags.camera = true;
                        gm("Когда ты открываешь программу, ты видишь 4\n" +
                            "экрана, расположенных 2х2. На каждом экране\n" +
                            "одна из комнат, где ты уже ранее был: спальня,\n" +
                            "кухня, химлаборатория, но четвертую комнату\n" +
                            "ты не узнаешь. Она практически черная, не\n" +
                            "считая пары белых светящихся глаз, которые\n" +
                            "пристально смотрят на вас через экран.\n" +
                            "Глаза медленно закрываются, и изображение\n" +
                            "начинает моргать. Все камеры, одна за другой,\n" +
                            "перестают работать, оставив за собой лишь\n" +
                            "статичный потрескивающий звук", null);
                    } else {
                        gm("Когда ты открываешь программу, ты видишь 4\n" +
                            "экрана, расположенных 2х2. На каждом экране\n" +
                            "одна из комнат, где ты уже ранее был.", null);
                    }
                }
            }
        ]);
    }

    function setFusePattern(raw) {
        const answer = raw.toUpperCase().replace(/[^A-Z]/g, "").split("").sort().join("");

        if (answer === "ABG" && state.selected === "Предохранитель" && has("Предохранитель")) {
            remove("Предохранитель");
            state.flags.fuseSet = "ABG";
            state.flags.powerOn = true;
            state.flags.abg = true;
            state.flags.acf = false;
            state.flags.acg = false;
            remove("Фонарик")
            gm("Когда последний предохранитель занимает\n" +
                "своего места, ты слышишь потрескивание\n" +
                "электричества и видишь, как пара искорок\n" +
                "вылетает из блока предохранителя. Лампа над\n" +
                "вами несколько раз моргает и затем загорается,\n" +
                "осветив всю комнату.", null);
            flickerLight();
        } else if (answer === "ACF" && state.flags.posterRotated) {
            state.flags.fuseSet = "ACF";
            state.flags.powerOn = true;
            state.flags.acf = true;
            state.flags.acg = false;
            state.flags.abg = false;
            gm("Ты вставляешь последний предохранитель,\n" +
                "и ослепительные искры разлетаются во все\n" +
                "стороны из блока предохранителя. Свет в\n" +
                "комнате несколько раз мигает, прежде чем\n" +
                "отключиться и погрузить тебя в темноту.\n" +
                "Ты слышишь, как вдали усилилось жужжание\n" +
                "большого устройства.", null);
            flickerLight();
        } else {
            state.flags.acg = true;
            state.flags.abg = false;
            state.flags.acf = false;
            say("Предохранители не встают на место.");
        }

        save();
        render();
    }

    function updateDarkness() {
        document.getElementById("darkness").classList.toggle("on", !state.flags.powerOn);
    }

    function flickerLight() {
        const overlay = document.getElementById("darkness");
        overlay.classList.remove("on");
        overlay.classList.add("flicker");

        setTimeout(() => {
            overlay.classList.remove("flicker");
            updateDarkness();
        }, 950);
    }

    let timerInterval = null;

    function formatTime(ms) {
        const total = Math.floor(ms / 1000);
        const h = String(Math.floor(total / 3600)).padStart(2, "0");
        const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
        const s = String(total % 60).padStart(2, "0");
        return `${h}:${m}:${s}`;
    }

    function currentElapsed() {
        if (!state.startedAt) return state.elapsedMs || 0;
        return (state.elapsedMs || 0) + (Date.now() - state.startedAt);
    }

    function startTimer() {
        if (state.startedAt) return;
        state.startedAt = Date.now();
        save();
        tickTimer();
        timerInterval = setInterval(tickTimer, 1000);
    }

    function stopTimer() {
        if (!state.startedAt) return;
        state.elapsedMs = currentElapsed();
        state.startedAt = null;
        clearInterval(timerInterval);
        timerInterval = null;
        save();
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        state.startedAt = null;
        state.elapsedMs = 0;
        const el = document.getElementById("timer");
        if (el) {
            el.hidden = true;
            el.textContent = "00:00:00";
        }
    }

    function tickTimer() {
        const el = document.getElementById("timer");
        if (!el) return;
        el.hidden = false;
        el.textContent = formatTime(currentElapsed());
    }

    function resumeTimerIfNeeded() {
        if (state.startedAt) {
            tickTimer();
            timerInterval = setInterval(tickTimer, 1000);
        } else if (state.elapsedMs > 0) {
            const el = document.getElementById("timer");
            if (el) {
                el.hidden = false;
                el.textContent = formatTime(state.elapsedMs);
            }
        }
    }

    function loadLeaderboard() {
        try {
            const raw = localStorage.getItem(LEADERBOARD_KEY);
            const arr = raw ? JSON.parse(raw) : [];
            return Array.isArray(arr) ? arr : [];
        } catch {
            return [];
        }
    }

    function saveLeaderboard(list) {
        localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(list));
    }

    function addLeaderboardEntry(name, ms) {
        const list = loadLeaderboard();
        list.push({name: String(name).slice(0, 24) || "Безымянный", ms, date: new Date().toISOString()});
        list.sort((a, b) => a.ms - b.ms);
        saveLeaderboard(list);
        return list;
    }

    function autoDownloadLeaderboard() {
        const data = JSON.stringify(loadLeaderboard(), null, 2);
        const blob = new Blob([data], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "leaderboard.json";
        a.click();
        URL.revokeObjectURL(url);
    }

    function showLeaderboard(mode, options = {}) {
        const {finalMs = null, onRestart = null} = options;
        let list = loadLeaderboard();

        document.getElementById("modalCard").classList.remove("gm-card");
        document.getElementById("modalTitle").textContent = "Таблица лидеров";

        const body = document.getElementById("modalBody");
        body.innerHTML = "";

        const info = document.createElement("p");
        if (mode === "finish" && finalMs !== null) {
            const best = list.length ? list[0].ms : null;
            info.textContent =
                `Твоё время: ${formatTime(finalMs)}\n` +
                (best !== null ? `Лучшее время: ${formatTime(best)}\n` : "") +
                `Записей: ${list.length}`;
        } else {
            info.textContent = `Записей: ${list.length}`;
        }
        body.appendChild(info);


        const wrap = document.createElement("div");
        wrap.className = "leaderboard";

        const table = document.createElement("table");
        table.innerHTML = "<thead><tr><th>#</th><th>Имя</th><th>Время</th></tr></thead>";
        const tbody = document.createElement("tbody");
        table.appendChild(tbody);
        wrap.appendChild(table);
        body.appendChild(wrap);

        function renderRows() {
            tbody.innerHTML = "";
            if (!list.length) {
                const tr = document.createElement("tr");
                const td = document.createElement("td");
                td.colSpan = 3;
                td.className = "empty";
                td.textContent = "Пока никто не финишировал.";
                tr.appendChild(td);
                tbody.appendChild(tr);
                return;
            }
            list.forEach((entry, i) => {
                const tr = document.createElement("tr");
                const td1 = document.createElement("td");
                td1.textContent = i + 1;
                const td2 = document.createElement("td");
                td2.textContent = entry.name;
                const td3 = document.createElement("td");
                td3.textContent = formatTime(entry.ms);
                tr.append(td1, td2, td3);
                tbody.appendChild(tr);
            });
        }

        renderRows();

        const actions = document.getElementById("modalActions");
        actions.innerHTML = "";

        if (mode === "finish") {
            const nameInput = document.createElement("input");
            nameInput.placeholder = "Твоё имя (Enter — сохранить)";
            nameInput.maxLength = 24;
            nameInput.autocomplete = "off";
            body.insertBefore(nameInput, wrap);

            const saveEntry = () => {
                if (nameInput.disabled) return;
                const name = nameInput.value.trim();
                if (!name) {
                    nameInput.focus();
                    return;
                }
                addLeaderboardEntry(name, finalMs);
                list = loadLeaderboard();
                renderRows();
                nameInput.disabled = true;
                autoDownloadLeaderboard();
                wrap.scrollTop = wrap.scrollHeight;
            };

            nameInput.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    saveEntry();
                }
            });

            const saveBtn = document.createElement("button");
            saveBtn.textContent = "Сохранить в таблицу";
            saveBtn.onclick = saveEntry;
            actions.appendChild(saveBtn);

            if (onRestart) {
                const restartBtn = document.createElement("button");
                restartBtn.textContent = "Начать заново";
                restartBtn.onclick = () => {
                    closeModal();
                    onRestart();
                };
                actions.appendChild(restartBtn);
            }

            const close = document.createElement("button");
            close.textContent = "Закрыть";
            close.onclick = closeModal;
            actions.appendChild(close);

            document.getElementById("modal").hidden = false;
            nameInput.focus();
            return;
        }

        const downloadBtn = document.createElement("button");
        downloadBtn.textContent = "Скачать таблицу";
        downloadBtn.onclick = exportLeaderboard;
        actions.appendChild(downloadBtn);

        const uploadBtn = document.createElement("button");
        uploadBtn.textContent = "Загрузить таблицу";
        uploadBtn.onclick = () => {
            importLeaderboard();
            setTimeout(() => {
                list = loadLeaderboard();
                renderRows();
            }, 800);
        };
        actions.appendChild(uploadBtn);

        const close = document.createElement("button");
        close.textContent = "Закрыть";
        close.onclick = closeModal;
        actions.appendChild(close);

        document.getElementById("modal").hidden = false;
    }

    function exportLeaderboard() {
        const data = JSON.stringify(loadLeaderboard(), null, 2);
        const blob = new Blob([data], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "leaderboard.json";
        a.click();
        URL.revokeObjectURL(url);
    }

    function importLeaderboard() {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".json,application/json";
        input.onchange = () => {
            const file = input.files && input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const parsed = JSON.parse(reader.result);
                    if (!Array.isArray(parsed)) throw new Error("bad format");
                    const clean = parsed
                        .filter(e => e && typeof e.name === "string" && Number.isFinite(e.ms))
                        .map(e => ({name: e.name.slice(0, 24), ms: e.ms, date: e.date || null}));
                    clean.sort((a, b) => a.ms - b.ms);
                    saveLeaderboard(clean);
                    alert("Таблица загружена. Открой её заново, чтобы увидеть.");
                } catch {
                    alert("Не удалось прочитать файл.");
                }
            };
            reader.readAsText(file);
        };
        input.click();
    }

    function restartGame() {
        localStorage.removeItem(SAVE_KEY);
        state = freshState();
        resetTimer();
        clearTimeout(messageTimer);
        clearTimeout(fadeTimer);
        document.getElementById("gameMessage").textContent = "";
        document.getElementById("gameMessage").classList.remove("fade-out");
        document.getElementById("modal").hidden = true;
        document.getElementById("game").hidden = true;
        document.getElementById("startScreen").hidden = false;
        const sidebar = document.querySelector(".sidebar");
        if (sidebar) sidebar.style.display = "";
    }

    function askFinalWord() {
        inputModal("Финал", "Введи нужные два слова", "Введи слова", code => {
            const normalized = code.trim().toLowerCase();
            if (normalized === "пора просыпаться") {
                stopTimer();
                const finalMs = currentElapsed();

                gm("Произнеся эти слова, ты участвуешь, будто\n" +
                    "что-то затягивает тебя внутрь куба. Все вокруг\n" +
                    "темнеет, и ты проваливаешься в разум твоих\n" +
                    "копий из куба. Твоя память начинает угасать,\n" +
                    "словно сон, и все твои воспоминания постепенно\n" +
                    "стираются. Последнее, за что цепляется твой\n" +
                    "разум, — это слова: Пора просыпаться.", () => {
                    state.flags.ending = true;
                    save();
                    showLeaderboard("finish", {finalMs, onRestart: restartGame});
                });
            } else {
                say("Слова не подействовали.");
            }
        });
    }

    function handleMachine() {
        if (!state.flags.powerOn || state.flags.fuseSet !== "ACF") {
            say("Нехватка энергии");
            return;
        }

        if (!state.flags.disketteUsed) {
            say("Запустить извлечение-воспоминаний.exe");
            return;
        }
        if (state.flags.ending) {
            askFinalWord();
            return;
        }
        inputModal("Машина", "На экране появляется последовательность слов.", "Введи слова", code => {
            const normalized = code.trim().toLowerCase();
            const inputWords = normalized.split(/\s+/).filter(w => w.length > 0);
            const targetWords = ["разум", "душа", "память", "узрите", "замок"];
            const isValid =
                inputWords.length === 5 &&
                targetWords.every(w => inputWords.includes(w)) &&
                inputWords.every(w => targetWords.includes(w));

            if (!state.flags.ending) {
                if (isValid) {
                    state.flags.ending = true;
                    gm("Ты повторяешь слова, и свет в кабинке\n" +
                        "становится ярче. Двери машины\n" +
                        "захлопываются, и ты оказываешься заперт\n" +
                        "внутри. Кабинка начинает трястись, и ты\n" +
                        "чувствуешь изнутри, как тебя пронзает мощная\n" +
                        "энергия. Белая вспышка ослепляет тебя, и все\n" +
                        "затихает. Машина и свет в ней выключаются,\n" +
                        "но двери остаются закрытыми. У себя под\n" +
                        "ногами ты замечаешь что-то. Это черный куб", () => {
                        gm("Ты поднимаешь куб. Он легче, чем вы думали,\n" +
                            "у него гладкая холодная поверхность. Когда\n" +
                            "ты разглядываешь его, ты обнаруживаешь,\n" +
                            "что сквозь него можно видеть, как если бы он\n" +
                            "был из стекла. Внутри ты видишь маленькую\n" +
                            "комнату с белой плиткой на стенах. В\n" +
                            "комнате стоит кровать, в ней спит человек. Ты\n" +
                            "присматриваешься и узнаешь самого себя", () => {
                            go("black");
                        });
                    });
                } else {
                    say("Машина не реагирует.");
                }
            }
        });
    }

    document.getElementById("resetBtn").onclick = () => {
        if (!confirm("Начать игру заново? Сохранение будет удалено.")) return;

        localStorage.removeItem(SAVE_KEY);
        state = freshState();
        resetTimer();

        clearTimeout(messageTimer);
        clearTimeout(fadeTimer);

        document.getElementById("gameMessage").textContent = "";
        document.getElementById("gameMessage").classList.remove("fade-out");
        document.getElementById("modal").hidden = true;

        document.getElementById("game").hidden = true;
        document.getElementById("startScreen").hidden = false;
    };

    document.getElementById("modal").addEventListener("click", event => {
        if (event.target.id === "modal") closeModal();
    });
    const rotateScreen = document.getElementById("rotateScreen");
    const touchDevice = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;

    function updateOrientationNotice() {
        const portrait = window.matchMedia("(orientation: portrait)").matches;
        rotateScreen.classList.toggle("visible", touchDevice && portrait);
    }

    window.addEventListener("resize", updateOrientationNotice);
    window.addEventListener("orientationchange", updateOrientationNotice);
    updateOrientationNotice();

    document.getElementById("playBtn").onclick = () => {
        document.getElementById("startScreen").hidden = true;
        document.getElementById("game").hidden = false;
        render();
        startTimer();

        if (!state.flags.visited.bedroom) {
            state.flags.visited.bedroom = true;
            save();
            gm(roomNarration.bedroom, null);
        }
    };
    let markClicks = 0;
    document.getElementById("startMark").addEventListener("click", () => {
        markClicks++;
        if (markClicks === 10) {
            showLeaderboard("view");
            markClicks = 0;
        }
    });

    resumeTimerIfNeeded();
</script>
</body>
</html>
